services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: billing
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Background job (shared requirement #3): nightly reconciliation of our
  # DB against Stripe's view — catches missed webhooks. Opt-in profile so
  # `docker compose up` stays unchanged:
  #   docker compose --profile jobs up reconciler -d
  # One-off run instead: docker compose exec api python -m jobs.reconcile
  reconciler:
    build: .
    env_file: .env
    command: python -m jobs.scheduler
    profiles: ["jobs"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
